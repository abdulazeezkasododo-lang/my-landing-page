<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samsung Galaxy A53 Giveaway</title>
  <meta name="description" content="Enter for a chance to win a Samsung Galaxy A53.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 20px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,.10);
    }
    .phone {
      font-size: 64px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 27px;
      line-height: 1.15;
      margin: 8px 0 12px;
    }
    p {
      font-size: 16px;
      line-height: 1.5;
      color: #4b5563;
      margin: 10px 0;
    }
    .button {
      display: block;
      margin: 22px 0 14px;
      padding: 16px 20px;
      border-radius: 12px;
      background: #111827;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
    }
    .button:active { transform: scale(.99); }
    .small {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="phone">📱</div>
    <h1>Enter for a Chance to Win a Samsung Galaxy A53</h1>
    <p>Want a chance to win? Tap the button below to continue to the entry page.</p>

    <a class="button"
       href="https://singingfiles.com/show.php?l=0&u=2560074&id=56776"
       rel="nofollow sponsored">
      Continue to Entry
    </a>

    <p class="small">
      This page is not affiliated with or endorsed by Samsung.
      Eligibility, entry requirements, and prize terms are determined by the promotion.
    </p>
  </main>
</body>
</html>
